openapi: 3.0.3
info:
  title: Employee List API
  version: 1.0.0
  description: REST API for retrieving the employee list. This OpenAPI spec is generated from specs/feature/001-list-employees/contracts/get-employees-endpoint.md.
servers:
  - url: https://api.example.com
    description: Production server
paths:
  /api/employees:
    get:
      summary: Get the list of employees
      description: Returns a sorted list of employees for authorized actor roles.
      operationId: getEmployees
      tags:
        - Employee
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response with an employees list or empty result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeListResponse'
        '403':
          description: Forbidden - user does not have permission to retrieve the employee list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  value:
                    error: Forbidden
                    message: 従業員一覧を取得する権限がありません。
        '500':
          description: Internal Server Error - employee list retrieval failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value:
                    error: InternalServerError
                    message: 従業員一覧の取得に失敗しました。再試行してください。
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Employee:
      type: object
      properties:
        employeeID:
          type: string
          description: Unique employee identifier.
          example: E12345
        fullName:
          type: string
          description: Employee name.
          example: 山田 太郎
        department:
          type: string
          description: Department name.
          example: 営業部
        title:
          type: string
          description: Job title.
          example: 課長
        employmentStatus:
          type: string
          description: Employment status.
          enum:
            - 在籍
            - 休職
            - 退職
          example: 在籍
      required:
        - employeeID
        - fullName
        - department
        - title
        - employmentStatus
    EmployeeListResponse:
      type: object
      properties:
        employees:
          type: array
          description: Sorted list of employees by employeeID.
          items:
            $ref: '#/components/schemas/Employee'
        message:
          type: string
          description: Optional message for empty result state.
          example: 現在、登録された従業員は存在しません。
      required:
        - employees
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message
